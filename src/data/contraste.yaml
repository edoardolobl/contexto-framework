# Pares de cor conferidos por scripts/check_contraste.py nos temas escuro e claro.
# frente: token da cor do texto ou da borda; fundos: tokens dos fundos onde ela aparece.
# minimo: 4.5 para texto, 3 para bordas e objetos gráficos, 7 para o texto secundário (UX-09).
# Os tokens ficam em src/styles/custom.css (ADR 0016). Sem 'temas', valem os dois.
# Fundos de página: base (--context-bg), superfície (--context-surface) e os fundos do Starlight
# mapeados para eles (navegação e barra lateral). O fundo inverso (--context-inverse) é igual nos dois temas.
pares:
  - nome: Texto principal sobre os fundos de página
    frente: --context-ink
    fundos: [--context-bg, --context-surface, --sl-color-bg-nav, --sl-color-bg-sidebar]
    minimo: 4.5
  - nome: Texto secundário sobre os fundos de página
    frente: --context-muted
    fundos: [--context-bg, --context-surface, --sl-color-bg-nav, --sl-color-bg-sidebar]
    minimo: 7
  - nome: Destaque, links, selo de aprovado e botão secundário (texto e borda) sobre os fundos de página
    frente: --sl-color-accent
    fundos: [--context-bg, --context-surface, --sl-color-bg-nav, --sl-color-bg-sidebar]
    minimo: 4.5
  - nome: Texto dourado (selo de rascunho, número errado do diagrama) sobre a base e a superfície
    frente: --context-gold-text
    fundos: [--context-bg, --context-surface]
    minimo: 4.5
  - nome: Borda de componente (caixas e ligações do diagrama) sobre a base e a superfície
    frente: --context-border
    fundos: [--context-bg, --context-surface]
    minimo: 3
  - nome: Borda tracejada do selo de rascunho sobre a base e a superfície
    frente: --context-gold
    fundos: [--context-bg, --context-surface]
    minimo: 3
  - nome: Texto do fundo inverso (frases do cartão da home)
    frente: --context-card-text
    fundos: [--context-inverse]
    minimo: 7
  - nome: Rótulos e nomes de campo no fundo inverso
    frente: --context-card-label
    fundos: [--context-inverse]
    minimo: 4.5
  - nome: Números, palavra DOCUMENTAR e estado em destaque no fundo inverso
    frente: --context-card-accent
    fundos: [--context-inverse]
    minimo: 4.5
  - nome: Bordas dos blocos internos do fundo inverso
    frente: --context-card-border
    fundos: [--context-inverse]
    minimo: 3
  - nome: Título e borda dos avisos note e tip sobre a superfície
    frente: --sl-color-accent
    fundos: [--context-surface]
    minimo: 4.5
  - nome: Título do aviso caution sobre a superfície
    frente: --context-gold-text
    fundos: [--context-surface]
    minimo: 4.5
  - nome: Borda do aviso caution sobre a superfície
    frente: --context-gold
    fundos: [--context-surface]
    minimo: 3
  - nome: Título e borda do aviso danger sobre a superfície
    frente: --context-danger
    fundos: [--context-surface]
    minimo: 4.5
  - nome: Texto dos quatro avisos e da citação sobre a superfície
    frente: --context-ink
    fundos: [--context-surface]
    minimo: 4.5
  - nome: Texto do botão principal, normal e com o ponteiro em cima
    frente: --context-button-text
    fundos: [--context-button-bg, --context-button-bg-hover]
    minimo: 4.5
  - nome: Texto do botão secundário com o ponteiro em cima
    frente: --sl-color-accent-high
    fundos: [--context-bg, --context-surface]
    minimo: 4.5
  - nome: Texto corrido do Starlight (corpo, menu lateral e sumário) sobre os fundos de página
    frente: --sl-color-text
    fundos: [--context-bg, --context-surface, --sl-color-bg-nav, --sl-color-bg-sidebar]
    minimo: 4.5
  - nome: Texto cinza do Starlight (gray-2) sobre a base e a barra lateral
    frente: --sl-color-gray-2
    fundos: [--context-bg, --sl-color-bg-sidebar]
    minimo: 4.5
  - nome: Texto cinza claro do Starlight (gray-3, rótulos e metadados) sobre a base e a barra lateral
    frente: --sl-color-gray-3
    fundos: [--context-bg, --sl-color-bg-sidebar]
    minimo: 4.5
  - nome: Títulos do Starlight no tema claro (no escuro ficam no branco do Starlight)
    frente: --sl-color-white
    fundos: [--context-bg, --context-surface]
    minimo: 4.5
    temas: [claro]
