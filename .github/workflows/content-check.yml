name: Verificar conteúdo e build
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar validador YAML
        run: python -m pip install -r requirements.txt
      - name: Verificar páginas, metadados e downloads
        run: python scripts/validate_content.py
      - name: Verificar consistência do exemplo de decisão
        run: python scripts/check_decision_examples.py
      - name: Reproduzir a amostra de Analytics e verificar rubricas
        run: python scripts/check_analytics_fixture.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Build do portal
        run: npm run build
      - name: Conferir links internos no HTML gerado
        run: python scripts/check_built_links.py
