name: Verificar conteúdo e build
on:
  pull_request:
  workflow_dispatch:
  # O deploy chama este mesmo workflow antes de publicar (auditoria TEC-10 e 10-direcao-proposta, fase F0).
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Ações fixadas por SHA do commit; o comentário diz a versão. O Dependabot propõe atualizações.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar validador YAML e testes
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      # Mesma ordem do `npm run check` local.
      - name: Testar os validadores
        run: npm run test:scripts
      - name: Verificar páginas, metadados, downloads, higiene, decisão, amostra e versões
        run: npm run check:content
      - name: Build do portal
        run: npm run build
      - name: Conferir links internos no HTML gerado
        run: npm run check:links
