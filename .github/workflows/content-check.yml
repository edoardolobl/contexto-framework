name: Verificar conteúdo e build
on:
  pull_request:
  workflow_dispatch:
  # O deploy chama este mesmo workflow antes de publicar (auditoria TEC-10 e 10-direcao-proposta, fase F0).
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Ações fixadas por SHA do commit; o comentário diz a versão. O Dependabot propõe atualizações.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar validador YAML e testes
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      # Mesma ordem do `npm run check` local.
      - name: Testar os validadores
        run: npm run test:scripts
      - name: Verificar páginas, metadados, downloads, higiene, decisão, amostra e versões
        run: npm run check:content
      - name: Build do portal
        run: npm run build
      - name: Conferir links internos no HTML gerado
        run: npm run check:links
