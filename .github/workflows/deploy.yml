name: Build and deploy Contexto to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nenhuma permissão por padrão; cada job pede só o que usa.
permissions: {}

# Um deploy em andamento termina sem ser interrompido; se houver outro pendente, o pendente mais antigo é substituído pelo mais novo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Publica só depois que testes, validadores, build e links passam (auditoria TEC-10).
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/content-check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
