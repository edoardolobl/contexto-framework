  other_domain_meanings:
    - "Na folha de pagamento, 'ativo' significa vínculo de trabalho vigente. Não é o mesmo conceito."

definition: "Pessoa inscrita no programa que registrou presença em pelo menos uma atividade nos últimos 30 dias corridos, contados a partir da data de referência do relatório."
inclusion_criteria:
  - "Inscrição confirmada no programa"
  - "Pelo menos uma presença registrada nos últimos 30 dias corridos"
exclusion_criteria:
  - "Inscrição sem nenhuma presença registrada: é participante inscrito"
  - "Afastamento registrado na data de referência: é participante em pausa"
  - "Todas as atividades concluídas: é participante concluinte"
examples:
  - "Inscrita em 01/08, presente na oficina de 20/08. Em 31/08 é participante ativa."
counterexamples:
  - "Inscrito em 01/08, sem nenhuma presença. Em 31/08 é participante inscrito, não ativo."
  - "Presente em 05/07 e nunca mais. Em 31/08 passaram mais de 30 dias: não é ativo."
boundary_cases:
  - "Presença exatamente 30 dias antes da data de referência: conta como ativa."

