business_definition:
  concept: "Relação entre número de pedidos confirmados e sessões elegíveis"
  purpose: "Acompanhar o resultado do funil web"
  synonyms: ["conversão web (rótulo histórico impreciso)"]
  different_meanings_in_other_domains:
