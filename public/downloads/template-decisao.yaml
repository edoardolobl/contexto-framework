# Contrato documental didático; não é executável DMN.
# null significa "ainda não sei" ou "ainda não decidido". Não troque null por um palpite: registre a dúvida em open_questions.
id: null
revision_id: null  # revisão específica; id = assunto estável
title: null
type: decision_rule
status: draft                # draft | pending_approval | approved | deprecated
version: "0.1"
version_date: null           # data desta versão, no formato AAAA-MM-DD
owner: null                  # cargo ou área responsável, não o nome de uma pessoa
approver: null
valid_from: null
valid_to: null  # fim exclusivo da vigência; null = sem fim documentado
supersedes_revision: null
source_of_truth: null
version_history:            # uma entrada por versão, a mais recente primeiro
  - version: "0.1"
    date: null
    change: null             # o que mudou nesta versão e por quê
    approved_by: null        # cargo ou área que aprovou; null enquanto não aprovado

decision_question: null
purpose: null
scope:
  applies_when: null
  not_applicable_when: null
required_inputs: []
possible_outputs: []
decision_table: []
priority_rules: []
default_behavior: null
unknown_input_behavior: null
exceptions: []
tests:
  - inputs: {}
    expected_outcome: null
    reasoning: null
  - inputs: {}
    expected_outcome: null
    reasoning: null
conflicts: []
open_questions: []
related_documents: []
