# Convenção documental didática, não é schema executável de fornecedor.
# null significa "ainda não sei" ou "ainda não decidido". Não troque null por um palpite: registre a dúvida em open_questions.
id: null
title: null
type: dataset_semantics
status: draft                # draft | pending_approval | approved | deprecated
version: "0.1"
version_date: null           # data desta versão, no formato AAAA-MM-DD
owner: null                  # cargo ou área responsável, não o nome de uma pessoa
approver: null
valid_from: null
source_of_truth: null
version_history:            # uma entrada por versão, a mais recente primeiro
  - version: "0.1"
    date: null
    change: null             # o que mudou nesta versão e por quê
    approved_by: null        # cargo ou área que aprovou; null enquanto não aprovado

dataset:
  physical_name: null
  platform: null
  business_purpose: null
  grain: null
  primary_key: null
  alternative_keys: []
  uniqueness_assumption: null

columns:
  - physical_name: null
    technical_type: null
    business_name: null
    meaning: null
    unit: null
    allowed_values: []
    sentinel_values: []
    null_meaning: null
    examples: []
    do_not_use_for: []

time_semantics:
  reference_field: null
  timezone: null
  update_frequency: null
  known_latency: null
  snapshot_or_events: null

usage:
  authoritative_questions: []
  invalid_aggregations: []
  related_datasets: []
  known_caveats: []
  sample_queries: []

validation:
  checked_by: null
  checked_at: null
  evidence: []
open_questions: []
related_documents: []
