questions:
  - id: Q01
    question: "Quais eventos do plano de mensuração pararam de coletar, considerando os dias completos até 15/11/2026?"
    goal: "Separar o evento que parou de coletar dos eventos que só têm dias em zero"
    assumptions: "Consulta em 17/11/2026; só valem dias completos (D+2), então o último dia contado é 15/11"
    phrasings: ["Algum evento do plano parou?", "O que está sem coletar desde a semana passada?"]
    onboarding: true
    expected_behavior: answer
    reference_answer: "Só o add_to_cart no México, sem nenhuma linha desde 11/11 (5 dias completos seguidos em zero, com média de 30 por dia na janela). O generate_lead no Brasil está em zero há 2 dias, o que é normal: tem zero em 9 de 27 dias completos e tolerância de 4 dias. O generate_lead não existe no México, então não se avalia lá"
    reference_sql: aurora-lab2-reference-query.sql
    required_sources: [DECISION-AURORA-EVENTO-QUEBRADO, EVENT-AURORA-GENERATE-LEAD, aurora-lab2-reference-query.sql]
    evidence_description: "Consulta de referência: add_to_cart MX com 5 dias em zero; generate_lead BR com sequência atual de 2 dias"
    ambiguity: null
    reason_if_abstain: null
    reviewed_by: "Analytics de E-commerce (Aurora)"
    reviewed_at: "2026-11-17"
